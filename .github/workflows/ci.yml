name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Start Postgres and S3
        run: docker compose -f tests/services/docker-compose.yml up -d --wait

      - run: npm ci

      - name: Type check
        run: npm run typecheck && npm run typecheck:web

      - name: i18n
        run: npm run i18n:validate

      - name: Colours only in design tokens
        run: npm run check:css-colors

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end API tests
        run: npm run test:e2e

      - name: End-to-end API tests through a transaction pooler (like Neon's pooled URL)
        run: npm run test:e2e
        env:
          TEST_DATABASE_URL: postgres://mw:mw@localhost:56432/mw

      - name: Official Bitwarden CLI against the server
        run: npm run test:official-cli

      - name: Web vault in a browser
        run: |
          npm install --prefix tests/ui --no-audit --no-fund --no-package-lock
          tests/ui/node_modules/.bin/playwright-core install --with-deps chromium
          UI_NO_DOCKER=1 npm run test:ui

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-artifacts
          path: tests/ui/.artifacts
          include-hidden-files: true

      - name: Official vercel build
        run: scripts/vercel-build-local.sh

      - name: Smoke test of the Vercel build output
        run: npx tsx --test tests/vercel-output.smoke.test.ts
