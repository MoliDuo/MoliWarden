# Disposable Postgres + S3 for the test suites (defaults in tests/helpers.ts).
#   docker compose -f tests/services/docker-compose.yml up -d --wait
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mw
      POSTGRES_PASSWORD: mw
      POSTGRES_DB: mw
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mw"]
      interval: 2s
      retries: 30
  s3:
    image: chrislusf/seaweedfs
    command: ["server", "-s3", "-s3.config=/etc/s3.json"]
    volumes:
      - ./s3.json:/etc/s3.json:ro
    ports:
      - "58333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 2s
      retries: 60
  # Transaction-mode pooler in front of Postgres, like Neon's pooled
  # (-pooler) connection string: TEST_DATABASE_URL=postgres://mw:mw@localhost:56432/mw
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DATABASE_URL: postgres://mw:mw@postgres:5432/mw
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      DEFAULT_POOL_SIZE: "5"
    ports:
      - "56432:5432"
    depends_on:
      postgres:
        condition: service_healthy
