<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>MoliWarden WebAuthn Connector</title>
    <style>
      :root {
        color-scheme: light dark;
        --primary: #171717;
        --primary-strong: #000000;
        --primary-fg: #ffffff;
        --text: #0a0a0a;
        --muted: #737373;
        --line: #e5e5e5;
        --panel: #ffffff;
        --surface: #fafafa;
        --soft: #f5f5f5;
        --danger: #b91c1c;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --primary: #fafafa;
          --primary-strong: #ffffff;
          --primary-fg: #0a0a0a;
          --text: #fafafa;
          --muted: #a3a3a3;
          --line: #262626;
          --panel: #141414;
          --surface: #0a0a0a;
          --soft: #1c1c1c;
          --danger: #f87171;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--surface);
        color: var(--text);
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      }

      .connector-card {
        width: min(100%, 430px);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
                padding: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }

      .brand img {
        width: 24px;
        height: 24px;
      }

      .brand strong {
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .form {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      button {
        min-height: 48px;
        width: 100%;
        border: 1px solid var(--primary);
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition: background-color 160ms ease, border-color 160ms ease, transform 120ms ease;
      }

      button:hover:not(:disabled)[aria-disabled="false"] {
        background: var(--primary-strong);
        border-color: var(--primary-strong);
      }

      button:active:not(:disabled)[aria-disabled="false"] {
        transform: translateY(1px);
      }

      button:disabled,
      button[aria-disabled="true"] {
        cursor: not-allowed;
        opacity: 0.62;
      }

      button[data-state="return"] {
        cursor: pointer;
        opacity: 1;
      }

      .msg {
        display: none;
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 14px;
        line-height: 1.45;
      }

      .msg.show {
        display: block;
      }

      .msg.info,
      .msg.success {
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--text);
      }

      .msg.error {
        border: 1px solid var(--danger);
        background: var(--panel);
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="connector-card" aria-labelledby="webauthn-header">
        <div class="brand">
          <img src="/logo.svg" alt="" />
          <strong>MoliWarden</strong>
        </div>
        <h1 id="webauthn-header">Verify your identity</h1>
        <p id="webauthn-copy">Use your security key to finish two-step verification.</p>
        <div class="form">
          <div id="webauthn-status" class="msg" role="status" aria-live="polite" hidden></div>
          <button id="webauthn-button" type="button" data-state="loading" aria-busy="true" aria-disabled="true">
            Preparing passkey…
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="/webauthn-mobile-connector.js"></script>
  </body>
</html>
