<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://api.pwnedpasswords.com;
    font-src 'self';
    form-action 'self';
    base-uri 'self';
  " />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MoliWarden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>MoliWarden</title>
    <style>
      :root {
        color-scheme: light dark;
        --boot-bg: #fafafa;
        --boot-panel: #ffffff;
        --boot-line: #e5e5e5;
        --boot-bar: #ebebeb;
        --boot-text: #0a0a0a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #0a0a0a;
          --boot-panel: #141414;
          --boot-line: #262626;
          --boot-bar: #262626;
          --boot-text: #fafafa;
        }
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .boot-card {
        width: min(360px, 100%);
        display: grid;
        gap: 14px;
        justify-items: center;
        padding: 28px;
        box-sizing: border-box;
        border: 1px solid var(--boot-line);
        border-radius: 10px;
        background: var(--boot-panel);
      }

      .boot-logo {
        width: 32px;
        height: 32px;
        margin-bottom: 4px;
        color: var(--boot-text);
      }

      .boot-line {
        width: 72%;
        height: 10px;
        border-radius: 999px;
        background: var(--boot-bar);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }

      .boot-line.short {
        width: 46%;
      }

      @keyframes boot-pulse {
        50% { opacity: 0.45; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card" aria-label="Loading MoliWarden">
          <img class="boot-logo" src="/logo.svg" alt="" />
          <div class="boot-line"></div>
          <div class="boot-line short"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
